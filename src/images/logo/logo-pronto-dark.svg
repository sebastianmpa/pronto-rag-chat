<svg width="176" height="44" viewBox="0 0 176 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Speed lines (yellow) -->
  <line x1="1" y1="19" x2="9" y2="19" stroke="#fab702" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="2" y1="14" x2="8" y2="16.5" stroke="#fab702" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="2" y1="24" x2="8" y2="21.5" stroke="#fab702" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Speech bubble circle -->
  <circle cx="25" cy="19" r="16" fill="#fab702"/>
  <!-- Speech bubble tail -->
  <path d="M15 32 L23 29 L23 36 Z" fill="#fab702"/>
  <!-- Robot head -->
  <rect x="15" y="11" width="20" height="14" rx="3" fill="#1a1a1a"/>
  <!-- Robot eyes -->
  <rect x="17" y="14" width="5.5" height="5" rx="1.2" fill="white"/>
  <rect x="24.5" y="14" width="5.5" height="5" rx="1.2" fill="white"/>
  <!-- Antenna pole -->
  <rect x="24" y="4" width="2" height="8" rx="1" fill="#1a1a1a"/>
  <!-- Antenna tip (yellow dot) -->
  <circle cx="25" cy="4" r="2.2" fill="#fab702"/>
  <!-- PRONTO (dark) + PRO (yellow) -->
  <text x="47" y="23" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" letter-spacing="0.5">
    <tspan fill="#1C2434">PRONTO</tspan><tspan fill="#fab702"> PRO</tspan>
  </text>
  <!-- Tagline -->
  <text x="47" y="36" font-family="Arial, Helvetica, sans-serif" font-size="6.5" font-weight="600" fill="#555555" letter-spacing="0.8">FAST ANSWERS. REAL SOLUTIONS.</text>
